services:
  postgres:
    image: postgres:16-alpine
    container_name: shopcontrol-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shopcontrol}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shopcontrol_dev_change_me}
      POSTGRES_DB: ${POSTGRES_CONTROL_DB:-shopcontrol_control}
    command:
      - postgres
      - -c
      - max_connections=300
      - -c
      - shared_buffers=256MB
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - shopcontrol_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shopcontrol} -d ${POSTGRES_CONTROL_DB:-shopcontrol_control}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: shopcontrol-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - shopcontrol_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: shopcontrol-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  shopcontrol_pgdata:
  shopcontrol_redisdata:
